name: release

on:
  release:
    types: [published]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# TODO(joel): The image path and tag scheme below are placeholders until the
# container setup is confirmed with the Galaxy admin (see AGENTS.md, CI
# section). It deliberately publishes the release tag as-is.

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/keponk/mpe-galaxy-notebook:${{ github.event.release.tag_name }}
            ghcr.io/keponk/mpe-galaxy-notebook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
