name: build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Dev pushes are frequent; only the newest build per branch runs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Push to dev: build the image and publish a rolling :dev tag plus a
  # :sha-<sha> tag to ghcr, so builds can be pinned/tested on a Galaxy
  # instance during development.
  build_and_publish_dev:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/keponk/mpe-galaxy-notebook:dev
            ghcr.io/keponk/mpe-galaxy-notebook:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # PRs into main (or manual dispatch from other branches): compile-check the
  # Containerfile only. No push, no registry access needed.
  build_validate:
    if: >-
      github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false
          tags: mpe-galaxy-notebook:localbuild
          cache-from: type=gha
          cache-to: type=gha,mode=max
